<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drag and drop - Example App</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
    #drag-source { width: 120px; padding: 1rem; background: #e3f2fd; border: 2px solid #1976d2;
                   cursor: grab; text-align: center; }
    #drop-target { width: 200px; height: 120px; border: 2px dashed #999; margin-top: 1rem;
                   display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h1>Drag and drop</h1>
  <div id="drag-source" draggable="true">Drag me</div>
  <div id="drop-target">Drop here</div>
  <p id="drop-status">Waiting for drop…</p>
  <script>
    var source = document.getElementById('drag-source');
    var target = document.getElementById('drop-target');
    // NOTE: the variable is intentionally named statusEl, not status -
    // window.status is a built-in string property, so `var status = ...`
    // would invoke its setter and silently drop the element reference.
    const statusEl = document.getElementById('drop-status');

    source.addEventListener('dragstart', function (e) {
      // The id travels on the drag's DataTransfer, exactly like a real user drag -
      // the framework's DragDropHelper fires these events synthetically with a
      // working DataTransfer, so no fallback state is needed.
      e.dataTransfer.setData('text/plain', source.id);
      e.dataTransfer.effectAllowed = 'move';
    });

    target.addEventListener('dragover', function (e) {
      // Required: without preventDefault the drop event never fires.
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    target.addEventListener('drop', function (e) {
      e.preventDefault();
      var id = e.dataTransfer.getData('text/plain');
      statusEl.textContent = 'Dropped: ' + id;
    });
  </script>
</body>
</html>
