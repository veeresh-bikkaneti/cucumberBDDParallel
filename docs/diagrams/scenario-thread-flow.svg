<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 354" role="img">
<title>One scenario, one browser, one thread — flowchart</title>
<style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
