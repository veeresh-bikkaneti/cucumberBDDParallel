.r-cloud .body{fill:#fffbeb;stroke:#d97706}.r-cloud text{fill:#78350f}
.r-security .body{fill:#fff1f2;stroke:#e11d48}.r-security text{fill:#881337}
.r-neutral .body{fill:#fafaf9;stroke:#a8a29e}.r-neutral text{fill:#1c1917}
.subgraph{fill:none;stroke:#a8a29e;stroke-width:1.5;stroke-dasharray:8 5}
.subgraph-title{fill:#57534e;font-size:11px}
.pill rect{fill:#ffffff;stroke:#a8a29e;stroke-width:1.2}
.pill text{fill:#1c1917;font-size:11px}
.pill.note rect{fill:#fffbeb;stroke:#d97706}
.pill.note text{fill:#78350f}
@media (prefers-reduced-motion:reduce){.node,.edge{animation:none!important}}
@media (prefers-color-scheme:dark){
.edge{stroke:#94a3b8}.edge-head{fill:#94a3b8}
.lifeline{stroke:#475569}
.subgraph{stroke:#64748b}.subgraph-title{fill:#94a3b8}
.r-client .body{fill:#083344;stroke:#22d3ee}.r-client text{fill:#a5f3fc}
.r-service .body{fill:#022c22;stroke:#34d399}.r-service text{fill:#a7f3d0}
.r-data .body{fill:#2e1065;stroke:#a78bfa}.r-data text{fill:#ddd6fe}
.r-cloud .body{fill:#451a03;stroke:#fbbf24}.r-cloud text{fill:#fde68a}
.r-security .body{fill:#4c0519;stroke:#fb7185}.r-security text{fill:#fecdd3}
.r-neutral .body{fill:#1e293b;stroke:#64748b}.r-neutral text{fill:#e2e8f0}
.pill rect{fill:#1e293b;stroke:#475569}.pill text{fill:#e2e8f0}
.pill.note rect{fill:#451a03;stroke:#fbbf24}.pill.note text{fill:#fde68a}
}
</style>
