<?xml version="1.0" encoding="UTF-8"?>
<!--
Original Mermaid source:
# file: docs/ARCHITECTURE.md
# section: ## Page objects and waits
# type: flowchart TD
flowchart TD
    BP[BasePage<br/>holds WebDriver + Wait]
    PF[PageFactory.initElements]
    ELF{AI healing<br/>configured?}
    DEF[DefaultElementLocatorFactory<br/>plain @FindBy lookup]
    SHE[AiElementLocatorFactory<br/>self-healing lookup]
    W[Wait<br/>explicit waits]

    BP - -> PF
    PF - -> ELF
    ELF - ->|no| DEF
    ELF - ->|yes| SHE
    BP - -> W

-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 468" role="img">
<title>Page objects and waits</title>
<style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.node{animation:node-in .6s cubic-bezier(.22,.61,.36,1) both}
@keyframes node-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.edge{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 5;animation:dash-flow 2.6s linear infinite}
.edge.reply{stroke-dasharray:2 5}
.edge-head{fill:#64748b;stroke:none}
@keyframes dash-flow{to{stroke-dashoffset:-24}}
.lifeline{stroke:#a8a29e;stroke-width:1.2;stroke-dasharray:5 5;opacity:.55}
.body{stroke-width:1.8}
.r-client .body{fill:#ecfeff;stroke:#0891b2}.r-client text{fill:#164e63}
.r-service .body{fill:#ecfdf5;stroke:#059669}.r-service text{fill:#064e3b}
.r-data .body{fill:#f5f3ff;stroke:#7c3aed}.r-data text{fill:#4c1d95}
.r-cloud .body{fill:#fffbeb;stroke:#d97706}.r-cloud text{fill:#78350f}
.r-security .body{fill:#fff1f2;stroke:#e11d48}.r-security text{fill:#881337}
.r-neutral .body{fill:#fafaf9;stroke:#a8a29e}.r-neutral text{fill:#1c1917}
.subgraph{fill:none;stroke:#a8a29e;stroke-width:1.5;stroke-dasharray:8 5}
.subgraph-title{fill:#57534e;font-size:11px}
.pill rect{fill:#ffffff;stroke:#a8a29e;stroke-width:1.2}
.pill text{fill:#1c1917;font-size:11px}
.pill.note rect{fill:#fffbeb;stroke:#d97706}
.pill.note text{fill:#78350f}
@media (prefers-reduced-motion:reduce){.node,.edge{animation:none!important}}
@media (prefers-color-scheme:dark){
.edge{stroke:#94a3b8}.edge-head{fill:#94a3b8}
.lifeline{stroke:#475569}
.subgraph{stroke:#64748b}.subgraph-title{fill:#94a3b8}
.r-client .body{fill:#083344;stroke:#22d3ee}.r-client text{fill:#a5f3fc}
.r-service .body{fill:#022c22;stroke:#34d399}.r-service text{fill:#a7f3d0}
.r-data .body{fill:#2e1065;stroke:#a78bfa}.r-data text{fill:#ddd6fe}
.r-cloud .body{fill:#451a03;stroke:#fbbf24}.r-cloud text{fill:#fde68a}
.r-security .body{fill:#4c0519;stroke:#fb7185}.r-security text{fill:#fecdd3}
.r-neutral .body{fill:#1e293b;stroke:#64748b}.r-neutral text{fill:#e2e8f0}
.pill rect{fill:#1e293b;stroke:#475569}.pill text{fill:#e2e8f0}
.pill.note rect{fill:#451a03;stroke:#fbbf24}.pill.note text{fill:#fde68a}
}
</style>
