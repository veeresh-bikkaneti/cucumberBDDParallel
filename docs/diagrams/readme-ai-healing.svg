<?xml version="1.0" encoding="UTF-8"?>
<!-- Original Mermaid source (d15.mmd):
# file: README.md
# section: ## AI self-healing locators
# type: flowchart TD
flowchart TD
    A[Step definition calls a page object method] - -> B[Selenium looks up the @FindBy element]
    B - -> C{Element found?}
    C - ->|Yes| D[Test continues]
    C - ->|No, healing off| E[Test fails: NoSuchElementException]
    C - ->|No, healing on| F[Send page HTML to configured LLM]
    F - -> G[LLM suggests a CSS selector]
    G - -> H{New selector finds it?}
    H - ->|Yes| D
    H - ->|No| E
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img">
<title>AI self-healing locators</title>
<style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.node{animation:node-in .6s cubic-bezier(.22,.61,.36,1) both}
@keyframes node-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.edge{fill:none;stroke:#57534e;stroke-width:1.8;stroke-dasharray:7 5;animation:dash-flow 2.6s linear infinite}
.edge.reply{stroke-dasharray:2 5}
.edge-head{fill:#57534e}
.life{stroke:#a8a29e;stroke-width:1.2;stroke-dasharray:5 5}
.subg{fill:none;stroke:#a8a29e;stroke-width:1.4;stroke-dasharray:8 5}
.subgtitle{fill:#78716c;font-weight:700;letter-spacing:.05em}
.lbl{fill:#44403c}
.pill{fill:#fafaf9;stroke:#d6d3d1;stroke-width:1.2}
.role-client .box{fill:#ecfeff;stroke:#0891b2}
.role-client text{fill:#164e63}
.role-service .box{fill:#ecfdf5;stroke:#059669}
.role-service text{fill:#064e3b}
.role-data .box{fill:#f5f3ff;stroke:#7c3aed}
.role-data text{fill:#4c1d95}
.role-cloud .box{fill:#fffbeb;stroke:#d97706}
.role-cloud text{fill:#78350f}
.role-security .box{fill:#fff1f2;stroke:#e11d48}
.role-security text{fill:#881337}
.role-neutral .box{fill:#fafaf9;stroke:#a8a29e}
.role-neutral text{fill:#1c1917}
@media (prefers-color-scheme:dark){
.edge{stroke:#94a3b8}.edge-head{fill:#94a3b8}
.life{stroke:#475569}.subg{stroke:#475569}.subgtitle{fill:#94a3b8}
.lbl{fill:#cbd5e1}.pill{fill:#1e293b;stroke:#475569}
.role-client .box{fill:#083344;stroke:#22d3ee}.role-client text{fill:#a5f3fc}
.role-service .box{fill:#022c22;stroke:#34d399}.role-service text{fill:#a7f3d0}
.role-data .box{fill:#2e1065;stroke:#a78bfa}.role-data text{fill:#ddd6fe}
.role-cloud .box{fill:#451a03;stroke:#fbbf24}.role-cloud text{fill:#fde68a}
.role-security .box{fill:#4c0519;stroke:#fb7185}.role-security text{fill:#fecdd3}
.role-neutral .box{fill:#1e293b;stroke:#64748b}.role-neutral text{fill:#e2e8f0}
}
@media (prefers-reduced-motion:reduce){.node,.edge{animation:none!important}}
@keyframes dash-flow{to{stroke-dashoffset:-24}}
</style>
